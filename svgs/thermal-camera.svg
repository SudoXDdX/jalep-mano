<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0E1019"/>
  <rect x="100" y="60" width="200" height="180" rx="8" stroke="#FF8A80" stroke-width="2" fill="#181D32"/>
  <text x="200" y="160" text-anchor="middle" fill="#FF8A80" font-size="16" font-family="monospace">THERMAL</text>
  <g stroke="#FFD740" stroke-width="0.5" opacity="0.4">
    <line x1="120" y1="100" x2="280" y2="100"/><line x1="120" y1="120" x2="280" y2="120"/>
    <line x1="120" y1="180" x2="280" y2="180"/><line x1="120" y1="200" x2="280" y2="200"/>
    <line x1="140" y1="80" x2="140" y2="220"/><line x1="200" y1="80" x2="200" y2="220"/>
    <line x1="260" y1="80" x2="260" y2="220"/>
  </g>
  <circle cx="200" cy="130" r="15" stroke="#FF8A80" stroke-width="1" fill="none" opacity="0.3">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="150" y="190" width="100" height="30" rx="4" fill="#FFD740" opacity="0.1" stroke="#FFD740" stroke-width="0.5"/>
  <text x="200" y="210" text-anchor="middle" fill="#FFD740" font-size="8" font-family="monospace" opacity="0.7">ACTIVE</text>
</svg>