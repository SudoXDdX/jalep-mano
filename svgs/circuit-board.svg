<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0E1019"/>
  <g stroke="#82B1FF" stroke-width="0.8" opacity="0.6">
    <line x1="20" y1="50" x2="120" y2="50"/><line x1="120" y1="50" x2="120" y2="120"/>
    <line x1="120" y1="120" x2="200" y2="120"/><line x1="200" y1="120" x2="200" y2="200"/>
    <line x1="200" y1="200" x2="300" y2="200"/><line x1="300" y1="200" x2="380" y2="200"/>
    <line x1="50" y1="80" x2="50" y2="180"/><line x1="50" y1="180" x2="150" y2="180"/>
    <line x1="150" y1="180" x2="150" y2="260"/><line x1="150" y1="260" x2="250" y2="260"/>
    <line x1="250" y1="260" x2="350" y2="260"/><line x1="350" y1="260" x2="350" y2="150"/>
    <line x1="350" y1="150" x2="280" y2="150"/><line x1="280" y1="150" x2="280" y2="80"/>
    <line x1="280" y1="80" x2="380" y2="80"/>
  </g>
  <g fill="#82B1FF" opacity="0.8">
    <circle cx="120" cy="50" r="3"/><circle cx="200" cy="120" r="3"/><circle cx="300" cy="200" r="3"/>
    <circle cx="50" cy="180" r="3"/><circle cx="150" cy="260" r="3"/><circle cx="350" cy="150" r="3"/>
  </g>
  <rect x="90" y="85" width="30" height="20" rx="2" stroke="#18FFFF" stroke-width="1" fill="#0E1019" opacity="0.9"/>
  <text x="105" y="98" text-anchor="middle" fill="#18FFFF" font-size="6" font-family="monospace">IC1</text>
  <rect x="230" y="170" width="40" height="25" rx="2" stroke="#B388FF" stroke-width="1" fill="#0E1019" opacity="0.9"/>
  <text x="250" y="186" text-anchor="middle" fill="#B388FF" font-size="6" font-family="monospace">CPU</text>
  <rect x="310" y="230" width="25" height="15" rx="2" stroke="#69F0AE" stroke-width="1" fill="#0E1019" opacity="0.9"/>
  <text x="322" y="240" text-anchor="middle" fill="#69F0AE" font-size="5" font-family="monospace">RAM</text>
  <g stroke="#FFD740" stroke-width="0.5" opacity="0.4">
    <line x1="170" y1="100" x2="190" y2="100"/><line x1="170" y1="105" x2="190" y2="105"/>
    <line x1="170" y1="110" x2="190" y2="110"/><line x1="170" y1="115" x2="190" y2="115"/>
  </g>
  <circle cx="200" cy="120" r="15" stroke="#82B1FF" stroke-width="0.5" fill="none" opacity="0.3">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>